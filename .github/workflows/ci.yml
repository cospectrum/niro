name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Test
        run: nix develop --no-update-lock-file -c uv run --locked pytest tests

      - name: Test installed CLI
        run: nix develop --no-update-lock-file -c uv run --no-sync pytest e2e

  test-windows:
    name: Test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.5

      - name: Test
        run: uv run --locked pytest tests

      - name: Test installed CLI
        run: uv run --no-sync pytest e2e

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Sync dependencies
        run: nix develop --no-update-lock-file -c uv sync --locked

      - name: Type check
        run: nix develop --no-update-lock-file -c uv run --no-sync ty check

      - name: Format check
        run: nix develop --no-update-lock-file -c uv run --no-sync ruff format --check

      - name: Lint
        run: nix develop --no-update-lock-file -c uv run --no-sync ruff check

[project]
name = "niro"
version = "0.0.1"
description = "Compiler for machine learning models targeting MLIR and other backends"
readme = "README.md"
authors = [
    { name = "Alex Severin", email = "severinalexeyv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "onnx>=1.22.0",
    "typer>=0.27.2",
    "xdsl>=0.70.0",
]

[project.scripts]
niro = "niro.cli:app"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mkdocstrings-python>=2.0.5",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "zensical>=0.0.58",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
